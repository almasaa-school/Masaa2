<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة المسعى v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ==================== الثيمات ==================== */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --surface-3: #f1f5f9;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #86868b;
  --border: rgba(0,0,0,.08);
  --border-strong: rgba(0,0,0,.12);
  --primary: #0071e3;
  --primary-2: #0058b8;
  --primary-soft: rgba(0,113,227,.1);
  --accent: #ff9500;
  --success: #34c759;
  --warning: #ff9f0a;
  --danger: #ff3b30;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 24px;
  --shadow: 0 4px 20px rgba(0,0,0,.05);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
  --glass: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.6);
}

[data-theme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --text: #f5f5f7;
  --text-2: #a1a1a6;
  --text-3: #8e8e93;
  --border: rgba(255,255,255,.1);
  --border-strong: rgba(255,255,255,.18);
  --primary: #0a84ff;
  --primary-2: #409cff;
  --primary-soft: rgba(10,132,255,.15);
  --glass: rgba(28,28,30,.72);
  --glass-border: rgba(255,255,255,.1);
  --shadow: 0 4px 20px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
}

[data-theme="edu"] {
  --bg: #f5f7f1;
  --surface: #ffffff;
  --surface-2: #f8faf3;
  --surface-3: #eef2e3;
  --text: #1a2f1a;
  --text-2: #4a6a4a;
  --text-3: #7a8f7a;
  --border: rgba(26,47,26,.08);
  --primary: #2d7a3e;
  --primary-2: #1e5a2a;
  --primary-soft: rgba(45,122,62,.12);
  --accent: #d4a017;
  --glass: rgba(255,255,255,.72);
}

[data-theme="royal"] {
  --bg: #f0f4fa;
  --surface: #ffffff;
  --surface-2: #f7fafd;
  --surface-3: #e5edf7;
  --text: #0f1f3d;
  --text-2: #4a5b7a;
  --text-3: #7a8aa3;
  --border: rgba(15,31,61,.08);
  --primary: #1e3a8a;
  --primary-2: #172e6b;
  --primary-soft: rgba(30,58,138,.1);
  --accent: #c9a227;
  --glass: rgba(255,255,255,.72);
}

[data-theme="warm"] {
  --bg: #fdf6f0;
  --surface: #ffffff;
  --surface-2: #fefaf6;
  --surface-3: #f8ede1;
  --text: #3d1f0f;
  --text-2: #6d4a3a;
  --text-3: #9a7a6a;
  --border: rgba(61,31,15,.08);
  --primary: #c2410c;
  --primary-2: #9a3412;
  --primary-soft: rgba(194,65,12,.1);
  --accent: #d97706;
  --glass: rgba(255,255,255,.75);
}

/* ==================== إعادة تعيين ==================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Cairo','Tajawal',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  min-height:100vh;
  transition:background .4s,color .4s;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}

/* ==================== التخطيط ==================== */
.app{display:flex;height:100vh;overflow:hidden}

.sidebar{
  background:var(--surface);
  border-left:1px solid var(--border);
  color:var(--text);
  width:280px;
  flex-direction:column;
  display:none;
  overflow-y:auto;
  flex-shrink:0;
  transition:all .3s;
}

.sidebar-brand{
  padding:26px 20px;
  text-align:center;
  border-bottom:1px solid var(--border);
}
.sidebar-brand .logo{
  width:72px;height:72px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  box-shadow:0 10px 30px -8px var(--primary);
}
.sidebar-brand h1{font-size:19px;font-weight:900;color:var(--text);margin:0;letter-spacing:-.02em}
.sidebar-brand p{font-size:12.5px;color:var(--text-2);margin-top:6px;font-weight:600}

.sidebar nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar nav a{
  display:flex;align-items:center;gap:13px;
  padding:12px 16px;border-radius:12px;
  color:var(--text-2);font-weight:700;cursor:pointer;
  font-size:14px;
  transition:all .2s;
  text-decoration:none;
}
.sidebar nav a i{width:22px;text-align:center;font-size:16px;transition:.2s}
.sidebar nav a:hover{background:var(--surface-3);color:var(--text)}
.sidebar nav a.active{
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:800;
}
.sidebar nav a.active i{transform:scale(1.1)}

.sidebar .footer{padding:16px;text-align:center;font-size:11px;color:var(--text-3);border-top:1px solid var(--border)}

.main{flex:1;overflow-y:auto;position:relative}

.main-header{
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--text);
  padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--border);
}
.main-header .brand{display:flex;align-items:center;gap:12px}
.main-header .brand-icon{
  width:42px;height:42px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.main-header .brand-icon i{color:#fff;font-size:19px}
.main-header h1{font-size:16px;font-weight:900;color:var(--text);margin:0}
.main-header button{
  background:var(--surface-3);border:none;color:var(--text);
  font-size:22px;cursor:pointer;width:44px;height:44px;border-radius:12px;
}

.content{padding:20px;max-width:1400px;margin:0 auto}

/* ==================== عناصر عامة ==================== */
.tab{display:none}
.tab.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  transition:all .3s;
}
.card:hover{box-shadow:var(--shadow-lg)}

.hero{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  border-radius:var(--radius-lg);
  padding:44px 28px;
  text-align:center;color:#fff;
  position:relative;overflow:hidden;
  margin-bottom:24px;
  box-shadow:0 20px 60px -20px var(--primary);
}
.hero::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.15),transparent 60%);
}
.hero h1{
  font-size:38px;font-weight:900;
  margin:0 0 10px;
  letter-spacing:-.03em;
  text-shadow:0 2px 20px rgba(0,0,0,.15);
  position:relative;
}
.hero p.subtitle{font-size:17px;color:rgba(255,255,255,.9);margin:0;font-weight:600;position:relative}
.hero p.note{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px;position:relative}
.hero .badge{
  display:inline-block;
  padding:7px 18px;
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);
  border-radius:100px;
  margin-bottom:16px;
  color:#fff;font-weight:800;font-size:12px;
  position:relative;
  backdrop-filter:blur(10px);
}
.hero .logos{display:flex;justify-content:center;gap:14px;margin-bottom:18px;position:relative}
.hero .logos div{
  width:74px;height:74px;background:rgba(255,255,255,.95);
  border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}
.hero .logos img{max-width:100%;max-height:100%;object-fit:contain}

/* ==================== الأزرار ==================== */
.btn{
  padding:12px 20px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  border:none;
  font-family:inherit;
  font-size:13.5px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:all .2s;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--primary);color:#fff;box-shadow:0 4px 14px -4px var(--primary)}
.btn-p:hover{background:var(--primary-2);box-shadow:0 8px 20px -4px var(--primary)}
.btn-g{background:var(--success);color:#fff;box-shadow:0 4px 14px -4px var(--success)}
.btn-y{background:var(--warning);color:#fff;box-shadow:0 4px 14px -4px var(--warning)}
.btn-r{background:var(--danger);color:#fff;box-shadow:0 4px 14px -4px var(--danger)}
.btn-o{background:var(--surface-3);color:var(--text);border:1px solid var(--border)}
.btn-o:hover{background:var(--border)}
.btn-s{padding:8px 13px;border-radius:10px;font-weight:800;cursor:pointer;border:none;font-family:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;justify-content:center;transition:.2s}
.btn-s:active{transform:scale(.95)}

/* ==================== الحقول ==================== */
input,select,textarea{
  padding:12px 15px;
  border:1.5px solid var(--border-strong);
  border-radius:12px;
  font-family:inherit;
  font-size:13.5px;
  width:100%;
  background:var(--surface);
  color:var(--text);
  font-weight:600;
  transition:.2s;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}
input::placeholder{color:var(--text-3)}

/* ==================== الجداول ==================== */
table{width:100%;text-align:right;border-collapse:collapse}
th{
  padding:13px 11px;
  background:var(--surface-3);
  color:var(--text-2);
  font-weight:800;
  font-size:12.5px;
  white-space:nowrap;
  text-align:right;
}
td{padding:12px;border-bottom:1px solid var(--border);font-size:13.5px}

/* ==================== الشارات ==================== */
.badge-sm{
  padding:4px 11px;
  border-radius:100px;
  font-size:10.5px;
  font-weight:800;
  display:inline-block;
  white-space:nowrap;
  letter-spacing:.01em;
}
.bt{background:var(--primary-soft);color:var(--primary)}
.bs{background:rgba(255,159,10,.15);color:var(--warning)}
.bb{background:rgba(10,132,255,.12);color:var(--primary)}
.bgreen{background:rgba(52,199,89,.15);color:var(--success)}
.bpurple{background:rgba(175,82,222,.15);color:#af52de}
.bred{background:rgba(255,59,48,.15);color:var(--danger)}
.bgray{background:var(--surface-3);color:var(--text-3)}

/* ==================== التنبيهات ==================== */
.alert{
  padding:14px 18px;
  border-radius:14px;
  margin-bottom:14px;
  font-weight:700;
  display:flex;align-items:center;gap:10px;
  font-size:13.5px;
}
.alert-success{background:rgba(52,199,89,.12);color:var(--success)}
.alert-error{background:rgba(255,59,48,.12);color:var(--danger)}
.alert-warning{background:rgba(255,159,10,.12);color:var(--warning)}
.alert-info{background:var(--primary-soft);color:var(--primary)}

/* ==================== النوافذ ==================== */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:100;
  justify-content:center;align-items:flex-start;
  padding:20px;overflow-y:auto;
}
.modal.open{display:flex}
.modal-content{
  background:var(--surface);
  border-radius:22px;
  padding:26px;
  max-width:600px;width:100%;
  margin:auto;
  animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.4);
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.modal-header h3{font-size:19px;font-weight:900;margin:0}
.modal-header button{
  background:var(--surface-3);border:none;
  width:36px;height:36px;border-radius:10px;
  font-size:20px;color:var(--text-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ==================== الشبكات ==================== */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}

/* ==================== البطاقات ==================== */
.tile{
  background:var(--surface);
  border-radius:20px;
  padding:22px 16px;
  text-align:center;
  cursor:pointer;
  transition:all .35s cubic-bezier(.2,.9,.3,1.2);
  border:1px solid var(--border);
  color:inherit;display:block;text-decoration:none;
}
.tile:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:var(--shadow-lg);
  border-color:var(--primary);
}
.tile .icon{
  width:72px;height:72px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 14px;color:#fff;
  box-shadow:0 8px 24px -8px currentColor;
}
.tile h3{font-size:15px;font-weight:900;margin:0 0 4px;color:var(--text)}
.tile p{color:var(--text-2);font-size:12px;margin:0}

.action-tile{
  border-radius:22px;
  padding:26px 22px;
  cursor:pointer;border:none;text-align:right;
  display:flex;align-items:center;gap:18px;
  transition:all .35s cubic-bezier(.2,.9,.3,1.2);
  width:100%;font-family:inherit;
  box-shadow:0 12px 32px -12px currentColor;
}
.action-tile:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 20px 50px -15px currentColor}
.action-tile:active{transform:scale(.98)}
.action-tile .aic{
  width:68px;height:68px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;flex-shrink:0;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(10px);
}
.action-tile h3{font-size:19px;font-weight:900;margin:0 0 4px;color:#fff}
.action-tile p{color:rgba(255,255,255,.9);font-size:12.5px;margin:0}

.stat-card{
  padding:18px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;align-items:center;gap:14px;
}
.stat-icon{
  width:52px;height:52px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.stat-label{color:var(--text-2);font-size:12px;font-weight:700;margin:0}
.stat-value{font-size:26px;font-weight:900;margin:0;letter-spacing:-.02em}

.counter{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-radius:14px;padding:10px 14px;
  text-align:center;min-width:72px;
  box-shadow:0 6px 18px -6px var(--primary);
}
.counter.over{background:linear-gradient(135deg,var(--danger),#c92a20);box-shadow:0 6px 18px -6px var(--danger)}
.counter.last-period{background:linear-gradient(135deg,var(--accent),#c67400);box-shadow:0 6px 18px -6px var(--accent)}
.counter-num{font-size:26px;font-weight:900;line-height:1;margin:0;letter-spacing:-.02em}
.counter-lbl{font-size:10px;font-weight:700;margin:3px 0 0;opacity:.95}

.avatar{
  width:50px;height:50px;border-radius:14px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;flex-shrink:0;
}

/* ==================== النبض ==================== */
.pulse{
  display:inline-block;width:10px;height:10px;border-radius:50%;
  background:var(--danger);animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,59,48,.7)}
  70%{box-shadow:0 0 0 12px rgba(255,59,48,0)}
  100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}
}

/* ==================== بطاقات الحصة الآن ==================== */
.now-card{
  padding:14px;
  border-radius:14px;
  border:1.5px solid var(--border);
  background:var(--surface);
  display:flex;align-items:center;gap:12px;
  transition:.2s;
}
.now-card.teach{background:var(--primary-soft);border-color:var(--primary)}
.now-card.abs{background:rgba(255,59,48,.08);border-color:var(--danger)}
.now-card.free{background:var(--surface-2);opacity:.7}

/* ==================== الأزرار الرقمية ==================== */
.num-btn{
  padding:10px 15px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  border:1.5px solid var(--border-strong);
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  font-size:13.5px;
  min-width:52px;
  transition:.15s;
}
.num-btn.active{
  background:var(--primary);color:#fff;border-color:var(--primary);
  box-shadow:0 4px 12px -4px var(--primary);
}
.day-btn{
  padding:10px 16px;border-radius:12px;font-weight:800;cursor:pointer;
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:13px;transition:.15s;
}
.day-btn.active{background:var(--warning);color:#fff;border-color:var(--warning)}

/* ==================== شبكة الجدول المدرسي ==================== */
.sched-cell{
  min-height:52px;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:6px;
  cursor:pointer;
  transition:all .2s;
  font-size:11px;font-weight:700;
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:var(--surface-2);
  color:var(--text-3);
}
.sched-cell:hover{border-color:var(--primary);transform:scale(1.05);z-index:5;box-shadow:0 4px 12px var(--primary-soft)}
.sched-cell.has{background:rgba(52,199,89,.15);color:var(--success);border-color:rgba(52,199,89,.4)}
.sched-cell.sub{background:rgba(255,159,10,.15);color:var(--warning);border-color:rgba(255,159,10,.4)}
.sched-cell.last{background:rgba(255,149,0,.2);color:var(--accent);border-color:var(--accent);position:relative}
.sched-cell.last::after{content:'★';position:absolute;top:2px;left:4px;font-size:9px}
.sched-cell .tname{font-weight:900;font-size:11px;line-height:1.2}
.sched-cell .cname{font-size:9.5px;opacity:.85}

.school-grid{
  overflow-x:auto;border-radius:14px;
  border:1.5px solid var(--border);
  background:var(--surface);
}
.school-grid table{margin:0;min-width:1000px}
.school-grid th{
  padding:11px 6px;font-size:11.5px;text-align:center;
  background:var(--primary);color:#fff;font-weight:800;
}
.school-grid th.day-col{
  background:var(--primary-2);min-width:95px;
}
.school-grid td{padding:4px;text-align:center;border:1px solid var(--border)}

.legend{
  display:flex;gap:16px;justify-content:center;
  font-size:12px;font-weight:700;flex-wrap:wrap;
  background:var(--surface);padding:13px;border-radius:12px;margin-top:12px;
  border:1px solid var(--border);
}
.legend .dot{
  display:inline-block;width:14px;height:14px;
  border-radius:4px;vertical-align:middle;margin-left:5px;
}

/* ==================== بطاقات الصفوف ==================== */
.class-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;padding:14px;
  display:flex;align-items:center;gap:12px;
  transition:.2s;
}
.class-card.original{background:rgba(52,199,89,.08);border-color:rgba(52,199,89,.3)}
.class-card.substitute{background:rgba(255,159,10,.08);border-color:rgba(255,159,10,.3)}
.class-card.absent{background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.3)}
.class-name{
  font-size:20px;font-weight:900;color:var(--primary);
  min-width:70px;text-align:center;
  background:var(--surface);border-radius:10px;
  padding:8px 4px;border:1.5px solid var(--primary-soft);
}

/* ==================== شريط العنوان ==================== */
.hdr-bar{
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  color:#fff;padding:16px 20px;border-radius:18px;
  display:flex;align-items:center;gap:14px;margin-bottom:20px;
  box-shadow:0 12px 30px -10px var(--primary);
}
.hdr-bar .icn{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
}
.hdr-bar h2{margin:0;font-size:20px;font-weight:900}
.hdr-bar p{margin:4px 0 0;font-size:13px;opacity:.85}

/* ==================== صندوق النسخ ==================== */
.copy-box{
  background:var(--surface-3);
  border:1.5px dashed var(--border-strong);
  border-radius:12px;padding:14px;
  font-family:monospace;font-size:12px;
  max-height:320px;overflow-y:auto;
  white-space:pre;direction:rtl;line-height:1.6;
  color:var(--text);
}

/* ==================== ثيم محدد - واجهة أبل ==================== */
.theme-selector{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
}
.theme-option{
  padding:16px 12px;border-radius:14px;
  border:2px solid var(--border);
  background:var(--surface);
  text-align:center;cursor:pointer;
  transition:.2s;
}
.theme-option:hover{border-color:var(--primary);transform:translateY(-3px)}
.theme-option.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 6px 16px -6px var(--primary)}
.theme-preview{
  width:100%;height:50px;border-radius:10px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;
}
.theme-option h4{font-size:12.5px;font-weight:800;margin:0 0 3px;color:var(--text)}
.theme-option p{font-size:10.5px;color:var(--text-3);margin:0}

/* ==================== إحصائيات المعلم ==================== */
.teacher-stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;padding:16px;
  transition:.25s;
}
.teacher-stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.teacher-progress{
  height:8px;background:var(--surface-3);border-radius:100px;overflow:hidden;margin-top:8px;
}
.teacher-progress-bar{
  height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));
  border-radius:100px;transition:width .5s;
}
.teacher-progress-bar.warning{background:linear-gradient(90deg,var(--warning),#c67400)}
.teacher-progress-bar.danger{background:linear-gradient(90deg,var(--danger),#c92a20)}

/* ==================== أيقونة الحصة الأخيرة ==================== */
.last-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:100px;
  background:rgba(255,149,0,.15);color:var(--accent);
  font-size:10px;font-weight:800;
}

/* ==================== استجابة الجوال ==================== */
@media (min-width:768px){
  .sidebar{display:flex}
  .main-header{display:none}
}
@media (max-width:767px){
  .sidebar{display:none}
  .content{padding:14px}
  .hero{padding:32px 20px}
  .hero h1{font-size:28px}
  .grid-stats,.grid-tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}
